name: Rebase OEM Kernel source to ACK
on:
  workflow_dispatch:
    inputs:
      REPO_URL:
        description: 'Kernel repository URL'
        default: 'https://github.com/rsuntk/android_kernel_asus_sdm660-4.19.git'
        required: true
      BRANCH:
        description: 'Kernel branch to Rebase'
        default: 'master'
        required: true
      ACK_BRANCH:
        description: 'Android Common Kernel branch'
        default: 'deprecated/android-4.19-stable'
        required: true
      TARGET_URL:
        description: 'Target URL to push'
        default: 'git@github.com:rsuntk/test_kernel.git'
        required: true
      INCREMENTAL_PUSH:
        description: 'Push commits in small batches'
        type: boolean
        default: false
        required: true

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup SSH Keys
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Setup environment
        run: |
          if [[ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]]; then
            echo "SSH Key is required in order to push this changes!"
            exit 1
          fi
          sudo apt install git -y
          git config --global user.name "rsuntk-worker-ci"
          git config --global user.email "noreply@example.com"
          git config --global core.preloadIndex true
          git config --global core.fscache true

      - name: Start rebase
        run: |
          curl https://raw.githubusercontent.com/rsuntk/android-kernel-rebaser/refs/heads/main/kernel-rebase.sh > rebase.sh; chmod +x rebase.sh
          bash ./rebase.sh "${{ inputs.REPO_URL }} -b ${{ inputs.BRANCH }}" "${{ inputs.ACK_BRANCH }}"

          cd kernel

          # Set Remote
          git remote set-url origin ${{ inputs.TARGET_URL }}

          # '*.bin' -> '# *.bin'
          sed -i 's/\*\.bin/# *.bin/g' .gitignore
          git add .gitignore
          git commit -sm ".gitignore: Do not ignore *.bin files"

          # Commit firmware
          git add .
          git commit -sm "firmware: Import missing required firmware files" || echo "No extra firmware files to commit"

          # Push the kernel source
          if [[ "${{ inputs.INCREMENTAL_PUSH }}" = "true" ]]; then
            BRANCH_NAME="${{ inputs.ACK_BRANCH }}"
            REMOTE_NAME="origin"
            STEP_SIZE=500000

            step_commits=$(git log --oneline --reverse refs/heads/$BRANCH_NAME | awk "NR % $STEP_SIZE == 0" | awk '{print $1}')

            echo "Starting incremental push for branch '$BRANCH_NAME' to remote '$REMOTE_NAME' with step size of $STEP_SIZE commits..."

            for commit in $step_commits; do
              echo "Pushing commit $commit..."
              git push $REMOTE_NAME +$commit:refs/heads/$BRANCH_NAME

              # Check if the last push succeeded
              if [[ $? -ne 0 ]]; then
                echo "Error pushing commit $commit. Exiting."
                exit 1
              fi
            done

            echo "Performing final mirror push..."
            git push $REMOTE_NAME --mirror

            echo "Incremental push complete!"
          else
            git push -u origin ${{ inputs.ACK_BRANCH }}
          fi
